<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina de Agentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="3d/style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/jsm/" } }
</script>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay"></div>

    <div id="hud">
    <div id="camBar">
      <button data-view="all" title="Ver toda la oficina (tecla 0)">Toda</button>
      <button data-view="agency" title="Lado Agencia (tecla 1)">Agencia</button>
      <button data-view="center" title="Cocina, sala y recepción (tecla 2)">Centro</button>
      <button data-view="askitar" title="Lado Askitar (tecla 3)">Askitar</button>
      <span class="sep"></span>
      <button id="btnWalk" title="Caminar por dentro: rueda para avanzar, arrastra para mirar, doble clic para ir a un punto (tecla C)">Caminar</button>
      <button id="btnFollow" title="Seguir al personaje seleccionado (tecla F)">Seguir</button>
      <button id="btnTour" title="Recorrido automático por toda la oficina (tecla T)">Recorrido</button>
      <button id="btnAuto" title="La cámara va sola a donde hay una alerta">Auto</button>
      <span class="sep"></span>
      <button id="btnTime" title="Luz: según tu hora real, día o noche">Hora real</button>
      <button id="btnQuality" title="Calidad de la imagen">Calidad alta</button>
    </div>
    <div id="roomBar"></div>
    </div>
    <canvas id="mini" width="264" height="168" title="Plano: clic para ir a ese lugar"></canvas>
    <div id="detail" hidden></div>
    <div id="helpHint">Arrastra para girar · clic derecho para mover · rueda para acercar · doble clic para ir a un punto</div>
    <div id="fps"></div>
    <div id="loading"><div class="ltitle">OFICINA DE AGENTES</div><div class="lbar"><i id="lprog"></i></div><div class="lsub" id="lsub">Abriendo la oficina…</div></div>
    <div id="offline" hidden>Sin conexión con el servidor de la oficina…</div>
  </main>

  <aside id="side">
    <header>
      <div class="brand">OFICINA DE AGENTES</div>
      <div class="sub" id="subtitle">Agencia + Askitar</div>
      <div class="chips">
        <span class="chip" id="chipSessions">0 sesiones</span>
        <span class="chip" id="chipWorking">0 trabajando</span>
        <span class="chip ok" id="chipDone">✓ 0 hoy</span>
      </div>
    </header>

    <nav class="tabs">
      <button data-tab="team" class="on">Equipo</button>
      <button data-tab="log">Actividad</button>
    </nav>

    <section id="tab-team" class="tab on"><ul id="teamList"></ul></section>
    <section id="tab-log" class="tab"><ul id="logList"></ul></section>

    <section id="chat" hidden>
      <div class="chat-head">
        <div><b id="chatName"></b> <span id="chatRole"></span></div>
        <button id="chatClose" title="Cerrar">×</button>
      </div>
      <div id="chatStatus"></div>
      <div id="permBar" hidden>
        <button data-level="read" title="Lee y responde, sin cambiar nada">Solo mirar</button>
        <button data-level="work" title="Edita en su carpeta y corre los comandos de su oficio">Puede trabajar</button>
        <button data-level="full" title="No pide permiso; un guardia automático frena lo peligroso">Todo activado</button>
        <button id="permAll" title="Aplicar este nivel a todos los agentes">A todos</button>
      </div>
      <div id="chatMsgs"></div>
      <form id="chatForm">
        <textarea id="chatInput" rows="2" placeholder="Escríbele al agente…"></textarea>
        <button type="submit" id="chatSend">Enviar</button>
      </form>
      <div class="hint" id="chatHint"></div>
    </section>

    <footer>
      <button id="btnDemo">▶ Demo</button>
      <label class="sw"><input type="checkbox" id="chkSound"> <span>Sonido cuando me necesitan</span></label>
    </footer>
  </aside>
</div>
<script type="module" src="3d/main.js"></script>
</body>
</html>
